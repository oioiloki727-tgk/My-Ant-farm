name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Native Wrapper Generator
        run: npm install -g html-to-android-wrapper || npm i -g @capacitor/cli

      - name: Create basic Android project structure
        run: |
          mkdir -p android_output
          echo "<html><body><h1>My Ant Farm Game</h1><p>Игра доступна по ссылке: https://oioiloki727-tgk.github.io/My-Ant-farm/</p></body></html>" > android_output/index.html

      - name: Package Web App into APK
        uses: kakasoin/html-to-apk-action@v1.0.3
        id: apk-builder
        with:
          config-file: ''
          url: 'https://oioiloki727-tgk.github.io/My-Ant-farm/'
          app-name: 'My Ant Farm'
          package-name: 'com.oioiloki.antfarm'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Ant-Farm-APK
          path: '*.apk'
